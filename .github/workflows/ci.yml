name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  gate:
    name: gate (node ${{ matrix.node }}, ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        node: ["22", "24"]
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.17.0

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Chromium (with OS deps on Linux)
        run: |
          if [ "$RUNNER_OS" = "Linux" ]; then
            pnpm --filter @browser-bridge/core exec playwright install --with-deps chromium
          else
            pnpm --filter @browser-bridge/core exec playwright install chromium
          fi
        shell: bash

      - name: Typecheck, lint, format
        run: pnpm typecheck && pnpm lint && pnpm format:check

      - name: Unit + contract + integration
        run: pnpm test && pnpm test:contract && pnpm test:integration

      - name: Build
        run: pnpm build

      - name: Package gate
        run: pnpm test:package

      - name: Benchmarks
        run: pnpm benchmark

      - name: Python example (where an interpreter exists)
        run: |
          if command -v python3 >/dev/null 2>&1; then
            echo "python3 present — example runs inside test:interop where available"
          else
            echo "no python3 on this runner; example ships unexecuted (see docs/phase-2-notes.md)"
          fi
        shell: bash

      - name: Interop
        run: pnpm test:interop

      - name: Upload benchmark results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-${{ matrix.os }}-node${{ matrix.node }}
          path: tests/benchmarks/results/
          if-no-files-found: warn
